<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="geminiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="480" fill="url(#bg)"/>

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="150" cy="100" r="140" fill="#2563eb" opacity="0.15" filter="url(#glowFilter)"/>
  <circle cx="1050" cy="380" r="160" fill="#7c3aed" opacity="0.15" filter="url(#glowFilter)"/>
  <circle cx="600" cy="240" r="220" fill="#4f46e5" opacity="0.08" filter="url(#glowFilter)"/>

  <!-- Decorative Grid Pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
    <line x1="960" y1="0" x2="960" y2="480"/>
    <line x1="1120" y1="0" x2="1120" y2="480"/>
  </g>

  <!-- Left Hero Content -->
  <g transform="translate(80, 75)">
    <!-- Category Badge -->
    <rect width="260" height="32" rx="16" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(96, 165, 250, 0.3)" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#60a5fa"/>
    <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="1">GESTIÓN UNIFICADA CON IA</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Workspace <tspan fill="url(#primaryGlow)">Copilot</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      El sistema operativo conversacional que unifica las 9 aplicaciones de Google Workspace.
    </text>
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#64748b">
      Lectura, creación, edición, renombrado y borrado con doble confirmación humana.
    </text>

    <!-- Integration Badges Row -->
    <g transform="translate(0, 190)">
      <!-- App Pills -->
      <g transform="translate(0, 0)">
        <rect width="105" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="19" font-family="sans-serif" font-size="14">📅</text>
        <text x="34" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Calendar</text>
      </g>
      <g transform="translate(115, 0)">
        <rect width="90" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="19" font-family="sans-serif" font-size="14">✉️</text>
        <text x="34" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Gmail</text>
      </g>
      <g transform="translate(215, 0)">
        <rect width="90" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="19" font-family="sans-serif" font-size="14">📁</text>
        <text x="34" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Drive</text>
      </g>
      <g transform="translate(315, 0)">
        <rect width="90" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="19" font-family="sans-serif" font-size="14">📝</text>
        <text x="34" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Docs</text>
      </g>
      <g transform="translate(415, 0)">
        <rect width="95" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="19" font-family="sans-serif" font-size="14">📊</text>
        <text x="34" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Sheets</text>
      </g>
    </g>

    <g transform="translate(0, 230)">
      <g transform="translate(0, 0)">
        <rect width="95" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="19" font-family="sans-serif" font-size="14">📽️</text>
        <text x="34" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Slides</text>
      </g>
      <g transform="translate(105, 0)">
        <rect width="90" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="19" font-family="sans-serif" font-size="14">☑️</text>
        <text x="34" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Tasks</text>
      </g>
      <g transform="translate(205, 0)">
        <rect width="90" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="19" font-family="sans-serif" font-size="14">💡</text>
        <text x="34" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Keep</text>
      </g>
      <g transform="translate(305, 0)">
        <rect width="105" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="19" font-family="sans-serif" font-size="14">👥</text>
        <text x="34" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Contacts</text>
      </g>
    </g>

    <!-- Tech specs pills -->
    <g transform="translate(0, 285)">
      <rect width="145" height="26" rx="6" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(192, 132, 252, 0.4)"/>
      <text x="10" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#d8b4fe">✦ Gemini 2.5 Flash</text>

      <rect x="155" width="130" height="26" rx="6" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(74, 222, 128, 0.4)"/>
      <text x="165" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#86efac">🛡️ Zero Data Retention</text>

      <rect x="295" width="115" height="26" rx="6" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(96, 165, 250, 0.4)"/>
      <text x="305" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd">⚡ Tool Calling</text>
    </g>
  </g>

  <!-- Right Visual Mockup Card -->
  <g transform="translate(680, 55)">
    <!-- Container Card -->
    <rect width="440" height="370" rx="20" fill="url(#cardBg)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.5))"/>

    <!-- Window top bar -->
    <rect width="440" height="42" rx="20" fill="rgba(15, 23, 42, 0.6)"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="21" r="5" fill="#10b981"/>
    <text x="80" y="25" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b">copilot-session • Google Workspace</text>

    <!-- User Prompt Bubble -->
    <g transform="translate(20, 60)">
      <rect width="400" height="52" rx="12" fill="rgba(59, 130, 246, 0.18)" stroke="rgba(59, 130, 246, 0.35)"/>
      <text x="16" y="24" font-family="sans-serif" font-size="12" font-weight="600" fill="#93c5fd">👤 Usuario:</text>
      <text x="16" y="42" font-family="sans-serif" font-size="12" fill="#e2e8f0">"Agenda reunión con @Carlos para revisar el contrato y prepara borrador"</text>
    </g>

    <!-- AI Response Card with Interactive Action Proposals -->
    <g transform="translate(20, 126)">
      <!-- AI text bubble -->
      <rect width="400" height="56" rx="12" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(71, 85, 105, 0.5)"/>
      <text x="16" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#a78bfa">⚡ Workspace Copilot:</text>
      <text x="16" y="44" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">Consulté el calendario de ambos y redacté el borrador en Gmail:</text>
    </g>

    <!-- Interactive Card: Calendar -->
    <g transform="translate(20, 194)">
      <rect width="400" height="66" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
      <text x="14" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#60a5fa">📅 Google Calendar • Propuesta Lista</text>
      <text x="14" y="44" font-family="sans-serif" font-size="11" fill="#94a3b8">Jueves, 16:00 - 17:00 • "Revisión Contrato Q4" (Google Meet incluido)</text>
      <!-- Action button -->
      <rect x="290" y="16" width="96" height="34" rx="8" fill="#2563eb"/>
      <text x="312" y="38" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Confirmar</text>
    </g>

    <!-- Interactive Card: Gmail Draft -->
    <g transform="translate(20, 272)">
      <rect width="400" height="76" rx="12" fill="#0f172a" stroke="#dc2626" stroke-width="1.2"/>
      <text x="14" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#f87171">✉️ Gmail • Borrador Interactivo</text>
      <text x="14" y="44" font-family="sans-serif" font-size="11" fill="#94a3b8">Para: carlos@empresa.com • Asunto: Revisión Contrato Q4</text>
      <text x="14" y="62" font-family="sans-serif" font-size="10.5" fill="#64748b">"Hola Carlos, adjunto los puntos clave acordados..."</text>
      <!-- Action button -->
      <rect x="290" y="22" width="96" height="34" rx="8" fill="#dc2626"/>
      <text x="318" y="44" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Enviar</text>
    </g>
  </g>
</svg>
